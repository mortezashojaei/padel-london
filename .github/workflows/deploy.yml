name: Deploy to server

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            export APP_DIR="${{ secrets.DEPLOY_APP_DIR }}"
            export BRANCH=main

            cat > "$APP_DIR/.env" << 'EOF'
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            MONITOR_MODE=london_all
            PRIORITY_TENANT_ID=2ab75436-9bb0-4e9c-9a6f-b12931a9ca4a
            PLAYTOMIC_TENANT_ID=2ab75436-9bb0-4e9c-9a6f-b12931a9ca4a
            PLAYTOMIC_TENANT_IDS=
            PLAYTOMIC_SPORT_ID=PADEL
            DAYS_AHEAD=7
            EXCLUDED_START_HOUR=8
            EXCLUDED_END_HOUR=18
            CHECK_INTERVAL_SECONDS=1800
            DRY_RUN=false
            STATE_FILE=/data/state.json
            EOF

            bash "$APP_DIR/deploy.sh"
